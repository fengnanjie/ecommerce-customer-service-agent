services:
  langfuse-worker:
    mem_limit: 768m
    environment:
      # 避免根目录 .env 中 电商客服助手Agent 的 MySQL DATABASE_URL 被 Compose 注入 Langfuse。
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres

  langfuse-web:
    # 当前 Langfuse v3 首次执行 init scripts 时约 630MB 堆仍会 OOM；
    # 显式给 1200MB 堆并留出原生内存，避免容器无限重启。
    mem_limit: 1536m
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      NODE_OPTIONS: --max-old-space-size=1200

  redis:
    mem_limit: 256m
    # Windows 在本机保留了 6343-6442，避开原来的 6380。
    # Langfuse 容器间仍通过 redis:6379 通信，仅调整宿主机调试端口。
    ports: !override
      - "127.0.0.1:16380:6379"

  postgres:
    mem_limit: 512m

  minio:
    mem_limit: 384m

  clickhouse:
    mem_limit: 1536m
